spring.application.name=disponibilidad

# Puerto del servicio Disponibilidad (tabla de puertos en Confluence)
server.port=8083

# Endpoints de monitoreo expuestos
management.endpoints.web.exposure.include=health,info

# Direcciones de los otros servicios
servicios.identidad.url=${IDENTIDAD_URL:http://localhost:8081}
servicios.alojamientos.url=${ALOJAMIENTOS_URL:http://localhost:8082}