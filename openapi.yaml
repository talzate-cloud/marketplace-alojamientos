components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AmenitiesInput:
      type: object
      properties:
        servicios:
          type: array
          items:
            type: string
      required:
      - servicios
    AuditList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              usuarioId:
                type: string
                format: uuid
              entidad:
                type: string
              accion:
                type: string
              resultado:
                type: string
              fecha:
                type: string
                format: date-time
    AuthToken:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        rol:
          $ref: '#/components/schemas/UserRole'
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigoReserva:
          type: string
        publicacionId:
          type: string
          format: uuid
        huespedId:
          type: string
          format: uuid
        fechaLlegada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        cantidadHuespedes:
          type: integer
        montoTotal:
          type: number
        estado:
          $ref: '#/components/schemas/BookingStatus'
        creadaEn:
          type: string
          format: date-time
    BookingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
    BookingRequest:
      type: object
      properties:
        cotizacionId:
          type: string
          format: uuid
        metodoPago:
          type: string
          description: Token de método de pago de prueba de Stripe, p. ej. pm_card_visa
      required:
      - cotizacionId
      - metodoPago
    BookingStatus:
      type: string
      enum:
      - CONFIRMADA
      - COMPLETADA
      - CANCELADA
      - EN_REVISION_MANUAL
    Calendar:
      type: object
      properties:
        publicacionId:
          type: string
          format: uuid
        periodos:
          type: array
          items:
            $ref: '#/components/schemas/Period'
    CancelRequest:
      type: object
      properties:
        motivo:
          type: string
          minLength: 3
      required:
      - motivo
    Cancellation:
      type: object
      properties:
        reservaId:
          type: string
          format: uuid
        canceladaPor:
          type: string
          format: uuid
        fecha:
          type: string
          format: date-time
        motivo:
          type: string
        valorDevolucionSimulada:
          type: number
        estadoFinal:
          $ref: '#/components/schemas/BookingStatus'
    Dashboard:
      type: object
      properties:
        usuarios:
          type: integer
        publicacionesActivas:
          type: integer
        reservasPorEstado:
          type: object
          additionalProperties:
            type: integer
        ingresosEstimados:
          type: number
        ciudadesMayorDemanda:
          type: array
          items:
            type: object
            properties:
              ciudad:
                type: string
              reservas:
                type: integer
    Error:
      type: object
      properties:
        codigo:
          type: string
        mensaje:
          type: string
        detalles:
          type: array
          items:
            type: string
    ExportRequest:
      type: object
      properties:
        tipoReporte:
          type: string
          enum:
          - USUARIOS
          - PUBLICACIONES
          - RESERVAS
          - INGRESOS
          - DEMANDA
        formato:
          type: string
          enum:
          - PDF
          - EXCEL
      required:
      - tipoReporte
      - formato
    ImagesInput:
      type: object
      properties:
        imagenes:
          type: array
          items:
            type: string
      required:
      - imagenes
    Listing:
      type: object
      properties:
        id:
          type: string
          format: uuid
        anfitrionId:
          type: string
          format: uuid
        titulo:
          type: string
        descripcion:
          type: string
        ciudad:
          type: string
        ubicacionTextual:
          type: string
        tipoAlojamiento:
          type: string
        capacidad:
          type: integer
        precioPorNoche:
          type: number
        tarifaLimpieza:
          type: number
        porcentajeDescuentoEstanciaLarga:
          type: number
        servicios:
          type: array
          items:
            type: string
        reglas:
          type: array
          items:
            type: string
        imagenes:
          type: array
          items:
            type: string
        politicaCancelacionId:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/ListingStatus'
        motivoRechazo:
          type: string
        motivoBloqueo:
          type: string
    ListingDetail:
      type: object
      properties:
        listing:
          $ref: '#/components/schemas/Listing'
        politicaCancelacion:
          $ref: '#/components/schemas/Policy'
        calificacionPromedio:
          type: number
        totalReseñas:
          type: integer
    ListingInput:
      type: object
      properties:
        titulo:
          type: string
        descripcion:
          type: string
        ciudad:
          type: string
        ubicacionTextual:
          type: string
        tipoAlojamiento:
          type: string
          enum:
          - APARTAMENTO
          - CASA
          - HABITACION
          - CABANA
          - OTRO
        capacidad:
          type: integer
          minimum: 1
        precioPorNoche:
          type: number
          exclusiveMinimum: 0
      required:
      - titulo
      - descripcion
      - ciudad
      - ubicacionTextual
      - tipoAlojamiento
      - capacidad
      - precioPorNoche
    ListingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
    ListingStatus:
      type: string
      enum:
      - BORRADOR
      - PENDIENTE_REVISION
      - ACTIVA
      - PAUSADA
      - BLOQUEADA
    LoginRequest:
      type: object
      properties:
        correo:
          type: string
          format: email
        password:
          type: string
      required:
      - correo
      - password
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tipoEvento:
          type: string
        entidadTipo:
          type: string
        entidadId:
          type: string
          format: uuid
        mensaje:
          type: string
        leida:
          type: boolean
        creadaEn:
          type: string
          format: date-time
    NotificationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    Period:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
        estado:
          type: string
          enum:
          - DISPONIBLE
          - RESERVADO
          - BLOQUEADO
    PeriodInput:
      type: object
      properties:
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
      required:
      - fechaInicio
      - fechaFin
    Policy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        descripcion:
          type: string
        porcentajeDevolucion:
          type: number
        permiteLiberacionPeriodo:
          type: boolean
    PolicyAssociation:
      type: object
      properties:
        politicaId:
          type: string
          format: uuid
      required:
      - politicaId
    PolicyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
    PricingInput:
      type: object
      properties:
        tarifaLimpieza:
          type: number
          minimum: 0
        porcentajeDescuentoEstanciaLarga:
          type: number
          minimum: 0
          maximum: 100
        nochesMinimasDescuento:
          type: integer
          minimum: 1
        serviciosAdicionales:
          type: array
          items:
            type: object
            properties:
              nombre:
                type: string
              costo:
                type: number
                minimum: 0
            required:
            - nombre
            - costo
    ProfileUpdate:
      type: object
      properties:
        nombre:
          type: string
        telefono:
          type: string
      required:
      - nombre
    Quote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        noches:
          type: integer
        precioBase:
          type: number
        tarifaLimpieza:
          type: number
        serviciosAdicionales:
          type: array
          items:
            type: object
            properties:
              nombre:
                type: string
              costo:
                type: number
        descuento:
          type: number
        porcentajeTarifaServicio:
          type: number
        tarifaServicio:
          type: number
        total:
          type: number
    QuoteRequest:
      type: object
      properties:
        publicacionId:
          type: string
          format: uuid
        fechaLlegada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        cantidadHuespedes:
          type: integer
          minimum: 1
        serviciosAdicionales:
          type: array
          items:
            type: string
      required:
      - publicacionId
      - fechaLlegada
      - fechaSalida
      - cantidadHuespedes
    ReasonInput:
      type: object
      properties:
        motivo:
          type: string
          minLength: 3
      required:
      - motivo
    RecoveryRequest:
      type: object
      properties:
        correo:
          type: string
          format: email
      required:
      - correo
    RegisterRequest:
      type: object
      properties:
        nombre:
          type: string
        correo:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        rol:
          type: string
          enum:
          - HUESPED
          - ANFITRION
          description: ADMINISTRADOR no es seleccionable (RN-001)
      required:
      - nombre
      - correo
      - password
      - rol
    ResetRequest:
      type: object
      properties:
        token:
          type: string
        nuevaPassword:
          type: string
          minLength: 8
      required:
      - token
      - nuevaPassword
    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reservaId:
          type: string
          format: uuid
        huespedId:
          type: string
          format: uuid
        publicacionId:
          type: string
          format: uuid
        calificacion:
          type: integer
        contenido:
          type: string
        visible:
          type: boolean
        fecha:
          type: string
          format: date-time
    ReviewInput:
      type: object
      properties:
        calificacion:
          type: integer
          minimum: 1
          maximum: 5
        contenido:
          type: string
      required:
      - calificacion
      - contenido
    ReviewList:
      type: object
      properties:
        calificacionPromedio:
          type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/Review'
    RulesInput:
      type: object
      properties:
        reglas:
          type: array
          items:
            type: string
      required:
      - reglas
    SearchResults:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              titulo:
                type: string
              ciudad:
                type: string
              tipoAlojamiento:
                type: string
              capacidad:
                type: integer
              precioPorNoche:
                type: number
              calificacionPromedio:
                type: number
              imagenPrincipal:
                type: string
        mensaje:
          type: string
          description: 'Ej.: ''No hay resultados'' (CA-057)'
    ServiceFee:
      type: object
      properties:
        porcentaje:
          type: number
          minimum: 0
          maximum: 100
      required:
      - porcentaje
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/UserRole'
        estado:
          $ref: '#/components/schemas/UserStatus'
    UserRole:
      type: string
      enum:
      - HUESPED
      - ANFITRION
      - ADMINISTRADOR
    UserStatus:
      type: string
      enum:
      - ACTIVO
      - INACTIVO
      - RESTRINGIDO
    UserStatusChange:
      type: object
      properties:
        estado:
          type: string
          enum:
          - ACTIVO
          - RESTRINGIDO
        motivo:
          type: string
      required:
      - estado
  responses:
    E400:
      description: Solicitud inválida (validación)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E401:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E402:
      description: Pago rechazado (Stripe test)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E403:
      description: Sin permiso para el rol o recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E404:
      description: No encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E409:
      description: Conflicto (reserva superpuesta, estado no permitido, duplicado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E410:
      description: Token vencido o ya usado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E422:
      description: Regla de negocio no cumplida (p. ej. falta información mínima o capacidad excedida)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
