# PLAN del pipeline de CI. En la Entrega 2 este archivo se mueve a .github/workflows/ci.yml
name: CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  build-test-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Compilar, probar y analizar los servicios con SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=<clave-proyecto> -Dsonar.organization=<organizacion>
          -Dsonar.host.url=https://sonarcloud.io
  build-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run lint && npm test -- --watch=false --browsers=ChromeHeadless && npm run build
        working-directory: frontend
  docker-build-and-contract:
    needs: [ build-test-services ]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-password
      JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_KEY }}
      STRIPE_CURRENCY: usd
      ADMIN_EMAIL: admin@ci.test
      ADMIN_INITIAL_PASSWORD: ci-admin-password
      CORS_ORIGIN: http://localhost:4200
      JAVA_TOOL_OPTIONS: -Xmx256m
    steps:
      - uses: actions/checkout@v4
      - name: Construir y levantar los contenedores
        run: docker compose up --build -d --wait
      - name: Pruebas de contrato con Newman
        run: npx --yes newman@6 run postman/marketplace.postman_collection.json
      - name: Detener
        if: always()
        run: docker compose down -v
