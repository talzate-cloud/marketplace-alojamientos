openapi: 3.0.3
info:
  title: API pública - Marketplace de Alojamientos (vista del API Gateway)
  version: 1.0.0
  description: 'Contrato consolidado de las rutas públicas que consume el front a través del API Gateway (puerto 8080). Las rutas /internal/* no se exponen por el Gateway: están en el contrato de cada servicio.
    Pagos solo con Stripe en modo prueba.'
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway (local)
security:
- bearerAuth: []
tags:
- name: Identidad y Usuarios
- name: Alojamientos
- name: Disponibilidad
- name: Búsqueda
- name: Cotización
- name: Reservas y Cancelaciones
- name: Pagos
- name: Notificaciones
- name: Reseñas
- name: Auditoría y Trazabilidad
- name: Reportes y Dashboard
paths:
  /auth/register:
    post:
      tags:
      - Identidad y Usuarios
      summary: Registrar usuario Huésped o Anfitrión
      operationId: register
      description: 'Historias: HU-01.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/E400'
        '409':
          $ref: '#/components/responses/E409'
  /auth/login:
    post:
      tags:
      - Identidad y Usuarios
      summary: Iniciar sesión
      operationId: login
      description: 'Historias: HU-02.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
  /auth/logout:
    post:
      tags:
      - Identidad y Usuarios
      summary: Cerrar sesión
      operationId: logout
      description: 'Historias: HU-02.'
      responses:
        '204':
          description: Operación exitosa
        '401':
          $ref: '#/components/responses/E401'
  /auth/password-recovery:
    post:
      tags:
      - Identidad y Usuarios
      summary: Solicitar recuperación simulada de contraseña (token en notificación interna)
      operationId: requestRecovery
      description: 'Historias: HU-04.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '202':
          description: Operación exitosa
        '400':
          $ref: '#/components/responses/E400'
  /auth/password-reset:
    post:
      tags:
      - Identidad y Usuarios
      summary: Definir nueva contraseña con token válido
      operationId: resetPassword
      description: 'Historias: HU-04.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
      responses:
        '204':
          description: Operación exitosa
        '400':
          $ref: '#/components/responses/E400'
        '410':
          $ref: '#/components/responses/E410'
  /users/me:
    get:
      tags:
      - Identidad y Usuarios
      summary: Consultar mi perfil
      operationId: getMe
      description: 'Historias: HU-05.'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/E401'
    put:
      tags:
      - Identidad y Usuarios
      summary: Actualizar mis datos básicos
      operationId: updateMe
      description: 'Historias: HU-05.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
  /users/me/deactivate:
    post:
      tags:
      - Identidad y Usuarios
      summary: Desactivar mi cuenta (no permitido con reservas futuras confirmadas)
      operationId: deactivate
      description: 'Historias: HU-06.'
      responses:
        '204':
          description: Operación exitosa
        '401':
          $ref: '#/components/responses/E401'
        '409':
          $ref: '#/components/responses/E409'
  /users/me/reactivate:
    post:
      tags:
      - Identidad y Usuarios
      summary: Reactivar mi cuenta
      operationId: reactivate
      description: 'Historias: HU-06.'
      responses:
        '204':
          description: Operación exitosa
        '401':
          $ref: '#/components/responses/E401'
  /admin/users/{id}/status:
    patch:
      tags:
      - Identidad y Usuarios
      summary: Restringir o reactivar un usuario
      operationId: setUserStatus
      description: 'Historias: HU-35. Rol requerido: ADMINISTRADOR.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusChange'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /listings:
    post:
      tags:
      - Alojamientos
      summary: Crear publicación en BORRADOR
      operationId: createListing
      description: 'Historias: HU-07. Rol requerido: ANFITRION.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingInput'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
  /listings/mine:
    get:
      tags:
      - Alojamientos
      summary: Consultar mis publicaciones con su estado
      operationId: myListings
      description: 'Historias: HU-15. Rol requerido: ANFITRION.'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingList'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
  /listings/{id}:
    get:
      tags:
      - Alojamientos
      summary: Consultar una publicación (propietario o administrador)
      operationId: getListing
      description: 'Historias: HU-08. Rol requerido: ANFITRION, ADMINISTRADOR.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    put:
      tags:
      - Alojamientos
      summary: Editar publicación (propietario o administrador)
      operationId: updateListing
      description: 'Historias: HU-08. Rol requerido: ANFITRION, ADMINISTRADOR.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingInput'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /listings/{id}/amenities:
    put:
      tags:
      - Alojamientos
      summary: Definir servicios (amenities)
      operationId: setAmenities
      description: 'Historias: HU-09. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmenitiesInput'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /listings/{id}/rules:
    put:
      tags:
      - Alojamientos
      summary: Definir reglas del alojamiento
      operationId: setRules
      description: 'Historias: HU-09. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesInput'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /listings/{id}/images:
    put:
      tags:
      - Alojamientos
      summary: Definir rutas o referencias de imágenes
      operationId: setImages
      description: 'Historias: HU-09. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagesInput'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /listings/{id}/pricing:
    put:
      tags:
      - Alojamientos
      summary: Definir tarifa de limpieza, descuento por estancia larga y servicios adicionales
      operationId: setPricing
      description: 'Historias: HU-10. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingInput'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /listings/{id}/cancellation-policy:
    put:
      tags:
      - Alojamientos
      summary: Asociar política de cancelación
      operationId: setPolicy
      description: 'Historias: HU-11. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyAssociation'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /cancellation-policies:
    get:
      tags:
      - Alojamientos
      summary: Listar políticas de cancelación disponibles
      operationId: listPolicies
      description: 'Historias: HU-11.'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyList'
        '401':
          $ref: '#/components/responses/E401'
  /listings/{id}/submit:
    post:
      tags:
      - Alojamientos
      summary: Enviar a revisión (BORRADOR a PENDIENTE_REVISION)
      operationId: submitListing
      description: 'Historias: HU-12. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
  /listings/{id}/pause:
    post:
      tags:
      - Alojamientos
      summary: Pausar publicación (ACTIVA a PAUSADA)
      operationId: pauseListing
      description: 'Historias: HU-14. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /listings/{id}/resume:
    post:
      tags:
      - Alojamientos
      summary: Reactivar publicación (PAUSADA a ACTIVA); no permitido si está BLOQUEADA
      operationId: resumeListing
      description: 'Historias: HU-14. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /admin/listings:
    get:
      tags:
      - Alojamientos
      summary: Listar publicaciones por estado (p. ej. PENDIENTE_REVISION)
      operationId: adminListings
      description: 'Historias: HU-13. Rol requerido: ADMINISTRADOR.'
      parameters:
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/ListingStatus'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingList'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
  /admin/listings/{id}/approve:
    post:
      tags:
      - Alojamientos
      summary: Aprobar publicación (PENDIENTE_REVISION a ACTIVA)
      operationId: approveListing
      description: 'Historias: HU-13. Rol requerido: ADMINISTRADOR.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /admin/listings/{id}/reject:
    post:
      tags:
      - Alojamientos
      summary: Rechazar publicación indicando motivo
      operationId: rejectListing
      description: 'Historias: HU-13. Rol requerido: ADMINISTRADOR.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /admin/listings/{id}/block:
    post:
      tags:
      - Alojamientos
      summary: Bloquear publicación; reservas futuras pasan a EN_REVISION_MANUAL
      operationId: blockListing
      description: 'Historias: HU-34. Rol requerido: ADMINISTRADOR.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /listings/{id}/availability:
    post:
      tags:
      - Disponibilidad
      summary: Registrar periodo disponible
      operationId: addPeriod
      description: 'Historias: HU-16. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodInput'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /listings/{id}/availability/{periodId}:
    put:
      tags:
      - Disponibilidad
      summary: Editar periodo (no permitido si tiene reservas confirmadas)
      operationId: updatePeriod
      description: 'Historias: HU-16. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: periodId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodInput'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
    delete:
      tags:
      - Disponibilidad
      summary: Eliminar periodo (no permitido si tiene reservas confirmadas)
      operationId: deletePeriod
      description: 'Historias: HU-16. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: periodId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Operación exitosa
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /listings/{id}/calendar:
    get:
      tags:
      - Disponibilidad
      summary: Consultar calendario (disponible, reservado, bloqueado)
      operationId: getCalendar
      description: 'Historias: HU-17.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
  /search/listings:
    get:
      tags:
      - Búsqueda
      summary: Buscar publicaciones ACTIVAS disponibles con filtros
      operationId: searchListings
      description: 'Historias: HU-19, HU-20.'
      security: []
      parameters:
      - name: ciudad
        in: query
        schema:
          type: string
        description: Ciudad
      - name: llegada
        in: query
        schema:
          type: string
        description: Fecha de llegada (YYYY-MM-DD)
      - name: salida
        in: query
        schema:
          type: string
        description: Fecha de salida, posterior a la llegada
      - name: huespedes
        in: query
        schema:
          type: integer
        description: Número de huéspedes
      - name: tipo
        in: query
        schema:
          type: string
        description: Tipo de alojamiento
      - name: precioMin
        in: query
        schema:
          type: number
        description: Precio mínimo por noche
      - name: precioMax
        in: query
        schema:
          type: number
        description: Precio máximo por noche
      - name: servicios
        in: query
        schema:
